[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "capture-board-viewer"
version = "0.1.0"
description = "A focused desktop viewer for USB HDMI capture devices."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6-Addons==6.10.2"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.5", "pyinstaller==6.22.3", "Pillow>=11,<13"]

[project.gui-scripts]
capture-viewer = "capture_viewer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
capture_viewer = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/capture_viewer/theme.py" = ["E501"]
